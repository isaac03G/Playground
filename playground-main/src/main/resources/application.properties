# Configuracion base de Playground. Los valores sensibles se inyectan desde el entorno.
spring.application.name=playground

# Servidor
server.port=${PORT}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Subida de imagenes. En produccion usa un volumen persistente fuera del JAR.
app.upload.dir=${UPLOAD_DIR}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# JWT: define JWT_SECRET con al menos 32 bytes aleatorios.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Google OAuth2. Configura estas variables y registra la URI de callback en Google Cloud.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Scrapers Python. SCRAPER_DIR debe apuntar a la carpeta playground-scripts.
app.scraper.dir=${SCRAPER_DIR}
app.scraper.python=${PYTHON_EXECUTABLE}
app.scraper.timeout-seconds=${SCRAPER_TIMEOUT_SECONDS}

# SteamGridDB (opcional)
app.steamgriddb.api-key=${STEAMGRIDDB_API_KEY}
app.steamgriddb.timeout-ms=${STEAMGRIDDB_TIMEOUT_MS}

# Actualizador programado. Desactivado por defecto para evitar ejecuciones inesperadas.
app.actualizador.auto=${ACTUALIZADOR_AUTO}
app.actualizador.cada=${ACTUALIZADOR_INTERVALO}
app.actualizador.espera-inicial=${ACTUALIZADOR_ESPERA_INICIAL}
