<!--
  registro.html — Alta de nuevos usuarios
  Modelo: registroUsuarioForm. Validación con Bean Validation (th:errors, #fields).
-->
<!DOCTYPE html>
<!-- xmlns:th — dialecto Thymeleaf (th:href, th:object, th:field, th:errors) -->
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <title th:text="#{registro.titulo}">Registro — Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- th:href="@{/css/styles.css}" — URL del CSS en /static -->
  <script th:src="@{/js/tema.js}"></script>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <th:block th:replace="~{fragments/nav-acciones :: menu-lateral}"></th:block>
    <a th:href="@{/}" style="text-decoration:none">
      <h1 class="logo"><span style="color:var(--primary)">PLAY</span>GROUND</h1>
    </a>
    <div class="nav-actions">
      <a th:replace="~{fragments/nav-acciones :: admin}"></a>
      <div th:replace="~{fragments/idioma :: selector}"></div>
    </div>
  </nav>
  <div class="reg-wrap">
    <h2 th:text="#{registro.h2}">CREAR CUENTA</h2>
    <!-- th:action POST /registro | th:object vincula el DTO | th:field genera name/value por campo -->
    <form th:action="@{/registro}" th:object="${registroUsuarioForm}" method="post">
      <!-- Usuario obligatorio; th:classappend añade is-error si hay errores de validación -->
      <div class="form-group">
        <label th:text="#{f.usuarioReq}">Nombre de usuario *</label>
        <input type="text" th:field="*{username}"
               th:classappend="${#fields.hasErrors('username') ? 'is-error' : ''}"
               required autocomplete="username">
        <!-- th:errors="*{campo}" — mensajes de validación del servidor -->
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>
      <div class="form-group">
        <label th:text="#{f.email}">Email *</label>
        <input type="email" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email') ? 'is-error' : ''}"
               required autocomplete="email">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="form-group">
        <label><th:block th:text="#{f.telefono}">Teléfono</th:block> <span class="opcional" th:text="#{f.opcional}">(opcional)</span></label>
        <input type="text" th:field="*{telefono}" autocomplete="tel">
      </div>
      <div class="form-group">
        <label><th:block th:text="#{f.direccion}">Dirección</th:block> <span class="opcional" th:text="#{f.opcional}">(opcional)</span></label>
        <input type="text" th:field="*{direccion}" autocomplete="street-address">
      </div>
      <div class="form-group">
        <label th:text="#{f.contrasenaReq}">Contraseña *</label>
        <input type="password" th:field="*{password}"
               th:classappend="${#fields.hasErrors('password') ? 'is-error' : ''}"
               required autocomplete="new-password">
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <div class="form-group">
        <label th:text="#{f.confirmarContrasena}">Confirmar contraseña *</label>
        <input type="password" th:field="*{confirmPassword}"
               th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-error' : ''}"
               required autocomplete="new-password">
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>
      <button type="submit" class="btn-block" th:text="#{registro.boton}">REGISTRARSE</button>
    </form>
    <div class="login-link">
      <th:block th:text="#{registro.yaCuenta}">¿Ya tienes cuenta?</th:block> <a th:href="@{/login}" th:text="#{nav.login}">Iniciar sesión</a>
    </div>
  </div>
</body>
</html>
